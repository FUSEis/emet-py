[project]
name = "emet-sdk"
dynamic = ["version"]
description = "Send your AI agent's turns to Emet from the OpenTelemetry GenAI spans it already emits"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "FUSE" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
]

[project.urls]
Homepage = "https://emet.so"
Source = "https://github.com/FUSEis/emet-py"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/emet_sdk/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/emet_sdk"]

[dependency-groups]
dev = [
    # Pydantic AI needs Python 3.11; its tests skip on 3.10
    "pydantic-ai-slim==2.63.0; python_version >= '3.11'",
    "pyright==1.1.414",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["emet_sdk"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
executionEnvironments = [
    { root = "src" },
    { root = "tests", extraPaths = ["."], reportPrivateUsage = false, reportUnknownMemberType = false, reportUnknownVariableType = false, reportUnknownArgumentType = false, reportMissingTypeStubs = false },
]
